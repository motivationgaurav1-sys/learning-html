<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewponit" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
  </head>
  <body>

    <form>


      <label for="name">Name:</label>
      <input type="text" name="username" id="name">
      <br><br>

      <label for="fathername">Father's Name:</label>
      <input type="text" name="userfathername" id="fathername">
      <br><br>

      <label for="age">Age:</label>
      <input type="number" name="age" id="age">
      <br><br>

      <label for="password">Password:</label>
      <input type="password" name="userpassword" id="password">
      <br><br>


      <label for="male">Male</label>
      <input type="radio" name="gender" id="male" value="Male">

      <label for="female">Female</label>
      <input type="radio" name="gender" id="female" value="Female">


      <label for="other">Other</label>
      <input type="radio" name="gender" id="other" value="Other">
      <br><br>


      <label for="C++">C++</label>
      <input type="checkbox" name="subject" id="C++" value="c++">

      <label for="java">Java</label>
      <input type="checkbox" name="subject" id="java" value="java">


      <label for="pyhton">Pyhton</label>
      <input type="checkbox" name="subject" id="pyhton" value="pyhton">


      <label for="html">Html</label>
      <input type="checkbox" name="subject" id="html" value="html">







  


      <br><br>

      <input type="submit">


    </form>
  </body>
  
</html>
